[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offerlens"
version = "0.1.0"
description = "Minimal local-first interview review report framework inspired by InterviewForge."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "OfferLens Maintainers" }]
keywords = ["interview", "asr", "report", "local-first", "agent"]
dependencies = []

[project.scripts]
offerlens = "offerlens.cli:main"
interviewforge-min = "offerlens.cli:main"

[tool.setuptools.packages.find]
include = ["offerlens*"]

[tool.setuptools.package-data]
offerlens = ["assets/*.tex", "examples/*.json"]
